services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID}
        PUBLIC_BETTER_AUTH_URL: ${PUBLIC_BETTER_AUTH_URL}
        PUBLIC_YANDEX_STORAGE_BUCKET: ${PUBLIC_YANDEX_STORAGE_BUCKET}
        PUBLIC_TURSO_DATABASE_URL: ${PUBLIC_TURSO_DATABASE_URL}
      secrets:
        - SECRET_GOOGLE_CLIENT
        - SECRET_BETTER_AUTH
        - SECRET_ADMIN_EMAILS
        - SECRET_TURSO_AUTH_TOKEN
        - SECRET_YANDEX_STORAGE_ACCESS_KEY
        - SECRET_YANDEX_STORAGE_KEY

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID}
      PUBLIC_BETTER_AUTH_URL: ${PUBLIC_BETTER_AUTH_URL}
      PUBLIC_YANDEX_STORAGE_BUCKET: ${PUBLIC_YANDEX_STORAGE_BUCKET}
      PUBLIC_TURSO_DATABASE_URL: ${PUBLIC_TURSO_DATABASE_URL}
      SECRET_GOOGLE_CLIENT: ${SECRET_GOOGLE_CLIENT}
      SECRET_BETTER_AUTH: ${SECRET_BETTER_AUTH}
      SECRET_ADMIN_EMAILS: ${SECRET_ADMIN_EMAILS}
      SECRET_TURSO_AUTH_TOKEN: ${SECRET_TURSO_AUTH_TOKEN}
      SECRET_YANDEX_STORAGE_ACCESS_KEY: ${SECRET_YANDEX_STORAGE_ACCESS_KEY}
      SECRET_YANDEX_STORAGE_KEY: ${SECRET_YANDEX_STORAGE_KEY}

    ports:
      - "8080:8080"

secrets:
  SECRET_GOOGLE_CLIENT:
    environment: SECRET_GOOGLE_CLIENT
  SECRET_BETTER_AUTH:
    environment: SECRET_BETTER_AUTH
  SECRET_ADMIN_EMAILS:
    environment: SECRET_ADMIN_EMAILS
  SECRET_TURSO_AUTH_TOKEN:
    environment: SECRET_TURSO_AUTH_TOKEN
  SECRET_YANDEX_STORAGE_ACCESS_KEY:
    environment: SECRET_YANDEX_STORAGE_ACCESS_KEY
  SECRET_YANDEX_STORAGE_KEY:
    environment: SECRET_YANDEX_STORAGE_KEY
